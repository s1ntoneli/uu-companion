name: macOS build checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Python relay deployer
        run: python3 -m py_compile Relay/deploy.py
      - name: Test open-source relay protocol
        run: node --test Relay/tests/relay.test.mjs
      - name: Build uu伴侣 App
        run: ./build.sh
      - name: Validate App signature
        run: codesign --verify --deep --strict build/uu伴侣.app
      - name: Validate bundled Native Mic driver
        run: |
          codesign --verify --strict NativeMic/build/UUMicNative.driver
          codesign --verify --strict build/uu伴侣.app/Contents/Resources/UUMicNative.driver
          test -s build/uu伴侣.app/Contents/Resources/UUMicNative.driver/Contents/MacOS/UUMicNative
          test -s build/uu伴侣.app/Contents/Resources/UUMicNative-0.1.2.pkg
          test -s build/uu伴侣.app/Contents/Resources/uucompanion.icns
      - name: ABI smoke test on Apple Silicon runner
        if: runner.arch == 'ARM64'
        run: |
          cd NativeMic
          clang -O2 Tests/DriverABITest.c -framework CoreAudio -framework CoreFoundation -o build/uu-native-driver-abi-test
          ./build/uu-native-driver-abi-test

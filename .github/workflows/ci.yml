name: macOS build checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Python relay deployer
        run: python3 -m py_compile Relay/deploy.py
      - name: Build uu伴侣 App
        run: ./build.sh
      - name: Validate App signature
        run: codesign --verify --deep --strict build/uu伴侣.app
      - name: Build Native Mic driver
        run: ./NativeMic/build.sh
      - name: Validate Native Mic bundle
        run: codesign --verify --strict NativeMic/build/UUMicNative.driver
      - name: ABI smoke test on Apple Silicon runner
        if: runner.arch == 'ARM64'
        run: |
          cd NativeMic
          clang -O2 Tests/DriverABITest.c -framework CoreAudio -framework CoreFoundation -o build/uu-native-driver-abi-test
          ./build/uu-native-driver-abi-test
